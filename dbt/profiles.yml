# dbt/taxi_analytics/profiles.yml
#
# Unlike a typical dbt setup, this file lives INSIDE the project folder
# (not in ~/.dbt/profiles.yml) so both local CLI usage and the Airflow
# container can point to it explicitly via --profiles-dir, without
# needing a separate copy-and-edit step in each environment.
#
# Safe to commit: every credential is read from an environment
# variable via env_var(), never hardcoded here.

taxi_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'postgres') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'nyc_taxi') }}"
      schema: public
      threads: 4